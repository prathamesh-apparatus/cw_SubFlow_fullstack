# SubFlow database ONLY. The app itself (UI + API) runs entirely in Next.js —
# there is no separate backend service anymore.
# Start the database with ONE command (from project root):  docker compose --env-file frontend/.env up -d
# Then run the app:  cd frontend && npm i && npm run dev
# No root .env — all env lives in frontend/.env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: subflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-subflow}
      POSTGRES_USER: ${DATABASE_USER:-subflow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./frontend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-subflow} -d ${DATABASE_NAME:-subflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [subflow_net]
volumes:
  postgres_data:
networks:
  subflow_net:
    driver: bridge
