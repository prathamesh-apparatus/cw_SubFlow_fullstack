# SubFlow database ONLY. The app itself (UI + API) runs entirely in Next.js —
# there is no separate backend service anymore.
# Start the database with ONE command (from project root):  docker compose up -d
# Then run the app from the same root folder:  npm i && npm run dev
# All env lives in the root .env (Compose reads it automatically).
services:
  postgres:
    image: postgres:16-alpine
    container_name: subflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-subflow}
      POSTGRES_USER: ${DATABASE_USER:-subflow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_strong_password}
    ports:
      # Host port 5433 (not 5432): a locally installed PostgreSQL may already
      # own 5432 on the host, and host-side connections must reach THIS
      # container. The app uses DATABASE_PORT=5433 in .env to match.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-subflow} -d ${DATABASE_NAME:-subflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [subflow_net]
volumes:
  postgres_data:
networks:
  subflow_net:
    driver: bridge
